name: Local stack

# The full pipeline on the Docker stack: Postgres -> Debezium -> Kafka ->
# bronze -> silver -> gold. Slower than the main CI, so it runs only when the
# pipeline, the stack or the examples change.
on:
  pull_request:
    paths:
      - "infra/**"
      - "src/**"
      - "examples/**"
      - "tests_e2e/**"
      - "Makefile"
      - ".github/workflows/local-stack.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Airflow loads the example project's generated Dags.
      CONTRACTLINE_DAGS: ../examples/airflow/dags
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: uv sync --python 3.11 --locked
      - name: Start all services
        run: |
          docker compose -f infra/docker-compose.yml --profile cdc --profile orchestration up -d --wait
          docker compose -f infra/docker-compose.yml --profile cdc run --rm connect-init
      - name: Smoke test
        run: make smoke-all
      - name: Generated Dags load in Airflow
        run: |
          compose="docker compose -f infra/docker-compose.yml"
          $compose exec -T airflow airflow dags reserialize > /dev/null
          errors=$($compose exec -T airflow airflow dags list-import-errors -o json)
          echo "$errors"
          [ "$errors" = "[]" ]
          $compose exec -T airflow airflow dags list -o plain | grep -c "__" 
      - name: End-to-end pipeline
        run: |
          infra/e2e-data.sh
          uv run pytest tests_e2e -v
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile cdc --profile orchestration logs
      - name: Stop
        if: always()
        run: make clean

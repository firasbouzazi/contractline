name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Validate example contracts
        run: uv run contractline validate examples/contracts
      - name: Lint naming conventions
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          args=(examples/contracts --branch "$BRANCH")
          if [ -n "$PR_TITLE" ]; then args+=(--pr-title "$PR_TITLE"); fi
          uv run contractline lint "${args[@]}"
      - name: Test
        run: uv run pytest --cov=contractline --cov-report=term-missing

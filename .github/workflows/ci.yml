name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Spark 4 needs Java 17+; Delta and Kafka jars are fetched from Maven on first use.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ hashFiles('uv.lock') }}
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Validate example contracts
        run: uv run contractline validate examples
      - name: Lint naming conventions
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          args=(examples --branch "$BRANCH")
          if [ -n "$PR_TITLE" ]; then args+=(--pr-title "$PR_TITLE"); fi
          uv run contractline lint "${args[@]}"
      # Spark tests are slow; they run once, on the oldest supported Python.
      - name: Test
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run pytest --cov=contractline --cov-report=term-missing
          else
            uv run pytest -m "not spark"
          fi

name: Deploy to one environment

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      smoke_test:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required reviewers on the "prod" environment make this the manual gate.
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the built artifact (the same one in every environment)
        run: |
          uv venv
          uv pip install "$(ls dist/*.whl)[spark]"
          tar xzf project.tgz
      - name: Plan
        run: |
          if [ -d contracts ]; then .venv/bin/contractline plan contracts pipelines --env ${{ inputs.env }}; fi
      - name: Smoke test on synthetic data
        if: inputs.smoke_test
        run: |
          if [ -d contracts ]; then .venv/bin/contractline test contracts pipelines --env ${{ inputs.env }}; fi

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
  # Ruff and mypy run from the locked dev environment so hooks and CI use the same versions.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: contractline-lint-contracts
        name: contractline lint (contracts)
        entry: uv run contractline lint
        language: system
        files: ^(examples/)?contracts/.*\.ya?ml$
      - id: contractline-lint-commit
        name: contractline lint (commit message)
        entry: uv run contractline lint --commit-message-file
        language: system
        stages: [commit-msg]

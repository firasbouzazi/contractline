[project]
name = "contractline"
version = "0.0.1"
description = "Data pipeline harness: declarative data contracts compiled into governed bronze/silver/gold pipelines."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "firasbouzazi", email = "firas.bouzazi@supcom.tn" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
contractline = "contractline.cli:app"

[project.optional-dependencies]
spark = [
    "delta-spark>=4.0,<4.1",
    "pyspark>=4.0,<4.1",
]

[dependency-groups]
dev = [
    "contractline[spark]",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "S"]
# PySpark convention: `functions as F`, `types as T`.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
# Tests build SQL on purpose (for example to prove gold isolation catches it).
"tests/**" = ["S101", "S608"]
"tests_e2e/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "tests_e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["spark: starts a local Spark session (slow)"]

[tool.importlinter]
root_package = "contractline"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core never depends on engines, adapters or tool libraries (ADR-0006)"
type = "forbidden"
source_modules = ["contractline.core"]
forbidden_modules = [
    "contractline.adapters",
    "contractline.spark",
    "pyspark",
    "delta",
    "airflow",
    "databricks",
]

[[tool.importlinter.contracts]]
name = "Blocks never depend on platform adapters (ADR-0010)"
type = "forbidden"
source_modules = ["contractline.spark"]
forbidden_modules = ["contractline.adapters"]

[[tool.importlinter.contracts]]
name = "Synthetic data needs no engine"
type = "forbidden"
source_modules = ["contractline.testing.synthetic"]
forbidden_modules = ["contractline.spark", "contractline.adapters", "pyspark"]

[[tool.importlinter.contracts]]
name = "Generated tests never depend on platform adapters"
type = "forbidden"
source_modules = ["contractline.testing"]
forbidden_modules = ["contractline.adapters"]
